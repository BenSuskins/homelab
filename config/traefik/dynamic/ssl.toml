################################################################
# SSL
################################################################
[[tls.certificates]]
  certFile = "/etc/traefik/certs/cert.pem"
  keyFile = "/etc/traefik/certs/key.pem"

[[tls.certificates]]
  certFile = "/etc/traefik/certs/pubgolfCert.pem"
  keyFile = "/etc/traefik/certs/pubgolfKey.pem"  

[tls.stores]
  [tls.stores.default]
    [tls.stores.default.defaultGeneratedCert]
      resolver = "cloudflare"
      [tls.stores.default.defaultGeneratedCert.domain]
        main = "suskins.co.uk"
        sans = ["*.suskins.co.uk"]

[tls.options]
  [tls.options.default]
    minVersion = "VersionTLS12"
