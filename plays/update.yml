---
- name: PREFLIGHT - Verify inventory loaded
  hosts: localhost
  gather_facts: false
  become: false
  tasks:
    - name: PREFLIGHT - Fail fast when no managed hosts resolved
      ansible.builtin.assert:
        that:
          - groups['all'] | default([]) | length > 0
        fail_msg: >
          Inventory resolved zero hosts. ansible.cfg is likely being ignored
          (e.g. a world-writable working directory), so the 'inventory'
          setting never loaded. Set ANSIBLE_CONFIG or pass -i inventory.
      tags: [always]

- name: UPDATE - Update and upgrade host
  hosts: all:!bumblebee
  become: true
  vars_files:
    - "~/.ansible/vault.yml"

  tasks:
    - name: UPDATE - Validate variables
      ansible.builtin.assert:
        that:
          - containers is defined
          - core_containers is defined
        fail_msg: "containers and core_containers must be defined"
      tags: [validation]

    - name: UPDATE - Update packages
      ansible.builtin.apt:
        update_cache: true
      tags: [packages]

    - name: UPDATE - Upgrade packages
      ansible.builtin.apt:
        upgrade: dist
      tags: [packages]

    - name: UPDATE - Update firewall
      ansible.builtin.include_tasks:
        file: "../tasks/other/firewall.yml"
      when: firewall | default(false) | bool
      tags: [firewall]

    - name: UPDATE - Configure Docker daemon log limits
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            },
            "dns": ["8.8.8.8", "8.8.4.4"]
          }
        mode: "0644"
      register: docker_daemon_config
      tags: [docker]

    - name: UPDATE - Restart Docker if daemon config changed
      ansible.builtin.service:
        name: docker
        state: restarted
      when: docker_daemon_config.changed
      tags: [docker]

    - name: UPDATE - Docker operations
      block:
        - name: UPDATE - Build expected container list
          ansible.builtin.set_fact:
            expected_containers: "{{ (containers | default([])) + (core_containers | default([])) + (special_containers | default([])) }}"

        - name: UPDATE - Update Core Docker Containers
          ansible.builtin.include_tasks:
            file: "../tasks/docker/{{ container }}.yml"
          loop: "{{ core_containers | default([]) }}"
          loop_control:
            loop_var: container

        - name: UPDATE - Update Docker Containers
          ansible.builtin.include_tasks:
            file: "../tasks/docker/{{ container }}.yml"
          loop: "{{ containers | default([]) }}"
          loop_control:
            loop_var: container

        - name: UPDATE - Update Special Containers
          ansible.builtin.include_tasks:
            file: "../tasks/docker/{{ container }}.yml"
          loop: "{{ special_containers | default([]) }}"
          loop_control:
            loop_var: container

        - name: UPDATE - Get all containers
          community.docker.docker_host_info:
            containers: true
          register: all_containers

        - name: UPDATE - Remove containers no longer defined
          community.docker.docker_container:
            name: "{{ item.Names[0] | regex_replace('^/', '') }}"
            state: absent
          loop: "{{ all_containers.containers | default([]) }}"
          loop_control:
            label: "{{ item.Names[0] | default('unknown') }}"
          when: (item.Names[0] | regex_replace('^/', '')) not in expected_containers
      rescue:
        - name: UPDATE - Record docker failure
          ansible.builtin.set_fact:
            docker_operations_failure: "{{ ansible_failed_result }}"
      tags: [docker]

    - name: UPDATE - Fail when docker operations failed
      ansible.builtin.fail:
        msg: >-
          Docker operations failed:
          {{ docker_operations_failure.msg | default('unknown error') }}
      when: docker_operations_failure is defined
      tags: [docker]

    - name: UPDATE - Aggregate services from all hosts
      ansible.builtin.include_tasks:
        file: "../tasks/core/aggregate_services.yml"
      run_once: true
      tags: [services]

    - name: UPDATE - Generate ARCHITECTURE.md (deployed-services from live inventory)
      ansible.builtin.include_tasks:
        file: "../tasks/other/generate_readme.yml"
      run_once: true
      tags: [docs]

    - name: UPDATE - Check if the OS requires a reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file
      tags: [reboot]

    # throttle keeps reboots to one host at a time so the rest of the lab
    # stays reachable; serial can't be used because service aggregation
    # needs docker_services facts from every host in the same batch.
    - name: UPDATE - Reboot server
      ansible.builtin.reboot:
        msg: "Rebooting server after update"
      when: reboot_required_file.stat.exists
      throttle: 1
      tags: [reboot]
