---
- name: PREFLIGHT - Verify inventory loaded
  hosts: localhost
  gather_facts: false
  become: false
  tasks:
    - name: PREFLIGHT - Fail fast when no managed hosts resolved
      ansible.builtin.assert:
        that:
          - groups['all'] | default([]) | length > 0
        fail_msg: >
          Inventory resolved zero hosts. ansible.cfg is likely being ignored
          (e.g. a world-writable working directory), so the 'inventory'
          setting never loaded. Set ANSIBLE_CONFIG or pass -i inventory.
      tags: [always]

- name: CLEAN - Perform system cleanup
  hosts: all:!bumblebee
  become: true
  vars_files:
    - "~/.ansible/vault.yml"

  tasks:
    - name: CLEAN - Validate variables
      ansible.builtin.assert:
        that:
          - journal_vacuum_time is defined
        fail_msg: "journal_vacuum_time must be defined in group_vars"
      tags: [validation]

    - name: CLEAN - Remove unused packages and clear apt cache
      block:
        - name: CLEAN - Run apt cleanup
          ansible.builtin.apt:
            autoremove: true
            autoclean: true
            clean: true
            purge: true
          register: apt_clean_res
      rescue:
        - name: CLEAN - Warn apt cleanup failed
          ansible.builtin.debug:
            msg: "APT cleanup failed, continuing"
      tags: [packages, cleanup]

    - name: CLEAN - Clean journal logs
      block:
        - name: CLEAN - Run journalctl vacuum
          ansible.builtin.command: journalctl --vacuum-time={{ journal_vacuum_time }}
          register: journal_clean_res
          changed_when: false
      rescue:
        - name: CLEAN - Warn journal cleanup failed
          ansible.builtin.debug:
            msg: "Journal cleanup failed, continuing"
      tags: [cleanup]

    - name: CLEAN - Remove old tmp files
      block:
        - name: CLEAN - Find tmp files older than 7 days
          ansible.builtin.find:
            paths: /tmp
            age: 7d
            recurse: true
            file_type: any
          register: old_tmp_files

        - name: CLEAN - Delete old tmp files
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: absent
          loop: "{{ old_tmp_files.files }}"
          loop_control:
            label: "{{ item.path | basename }}"
      rescue:
        - name: CLEAN - Warn tmp cleanup failed
          ansible.builtin.debug:
            msg: "Tmp cleanup failed, continuing"
      tags: [cleanup]

    - name: CLEAN - Truncate Docker container logs
      block:
        - name: CLEAN - Find container log files
          ansible.builtin.find:
            paths: /var/lib/docker/containers
            patterns: "*-json.log"
            recurse: true
          register: container_logs

        - name: CLEAN - Truncate container log files
          ansible.builtin.command: truncate -s 0 {{ item.path }}
          loop: "{{ container_logs.files }}"
          loop_control:
            label: "{{ item.path | basename }}"
          changed_when: item.size > 0
      rescue:
        - name: CLEAN - Warn log truncation failed
          ansible.builtin.debug:
            msg: "Docker log truncation failed, continuing"
      tags: [docker, cleanup]

    - name: CLEAN - Prune unused Docker resources
      block:
        - name: CLEAN - Run docker prune
          community.docker.docker_prune:
            containers: true
            images: true
            images_filters:
              dangling: false
            networks: false
            volumes: true
            builder_cache: true
          register: docker_prune_res
      rescue:
        - name: CLEAN - Warn docker prune failed
          ansible.builtin.debug:
            msg: "Docker prune failed, continuing"
      tags: [docker, cleanup]

    - name: CLEAN - Set reboot_required if cleanup changed anything
      ansible.builtin.set_fact:
        reboot_required: true
      when: >
        (apt_clean_res is defined and (apt_clean_res.changed | default(false))) or
        (docker_prune_res is defined and (docker_prune_res.changed | default(false)))
      tags: [reboot]

    - name: CLEAN - Reboot server
      ansible.builtin.reboot:
        msg: "Rebooting server after cleanup"
      when: reboot_required | default(false)
      tags: [reboot]
