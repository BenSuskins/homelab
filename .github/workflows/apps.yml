name: Apps

# The mirror image of the `paths-ignore: ['apps/**']` blocks on `update.yml`
# and `build-mcp-arr.yml` (see ADR-0003). Those stop Swift commits deploying
# Ansible to six hosts; this is the half that actually checks the Swift.
#
# It cannot run on the `self-hosted` runner, which is Linux.
on:
  push:
    branches: [main]
    paths: ['apps/**', '.github/workflows/apps.yml']
  pull_request:
    paths: ['apps/**', '.github/workflows/apps.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # The image's default Xcode, not a pinned one. See the `ios` job below
      # for what pinning cost; the two jobs share a toolchain so that a compile
      # passing here cannot mean something different there.
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      # The shared package holds every testable decision in both apps, so this
      # is the job that matters.
      - name: Test HomelabCore
        working-directory: apps/homelab-core
        run: swift test

      # Contract tests are excluded by name: they hit the live API with the
      # token you signed in with, which CI has no way to hold.
      - name: Test the menu bar app
        working-directory: apps/homelab-menubar
        run: swift test --skip Contract

      - name: Build the menu bar app
        working-directory: apps/homelab-menubar
        run: swift build -c release --product HomelabMenuBar

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # The image's default Xcode, never a pinned one.
      #
      # This job pinned `Xcode_16.app` and had never once passed. Xcode 16.0's
      # SDK is iOS 18.0, and `macos-15` stopped carrying anything that matches
      # it — neither the iOS platform nor a simulator runtime old enough for
      # its SDK. Depending on which image build the run landed on, that failed
      # either at destination resolution:
      #
      #     error: Unable to find a destination matching the provided
      #     destination specifier: { generic:1, platform:iOS }
      #     … iOS 18.0 is not installed …
      #
      # or, one step later, at the asset catalogue:
      #
      #     Assets.xcassets: error: No simulator runtime version from
      #     [22F77, 22G86, 23A8464, 23B86, 23C54] available to use with
      #     iphonesimulator SDK version 22A3362
      #
      # The second is why the device destination below did not save it, as the
      # comment there once claimed it would: `actool` reaches for a simulator
      # runtime to render icons even when building for a device. A pinned Xcode
      # ages out from under the runner image; the default never can.
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      # No test step: the iOS target is views and wiring over HomelabCore,
      # which the job above covers. A clean compile is what there is to prove.
      #
      # A generic destination rather than a named device: this only ever
      # compiles, and naming one ties the job to whichever simulators the
      # runner image happens to ship — which is how the first run of this
      # workflow failed, on a missing "iPhone 16", before building anything.
      #
      # `generic/platform=iOS` — a device — rather than `iOS Simulator`, so no
      # simulator has to exist for a compile that never runs anything. With
      # signing off it compiles exactly the same sources.
      #
      # This was once justified as also dodging the simulator-runtime problem
      # quoted against `Select Xcode` above. It does not: `actool` wants a
      # runtime for the icons whichever platform is being built for. What fixed
      # that was unpinning Xcode, not the destination.
      - name: Build for iOS
        working-directory: apps/homelab-ios
        run: |
          xcodebuild build \
            -project Homelab.xcodeproj \
            -scheme Homelab \
            -destination 'generic/platform=iOS' \
            -resultBundlePath build.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # xcodebuild batches Swift compiles, and when one fails it can report
      # nothing but "Command SwiftCompile failed with a nonzero exit code" —
      # the diagnostics stay in the result bundle. Without this a red build
      # says only that something broke, not what, which cost several rounds.
      - name: Show build diagnostics
        if: failure()
        working-directory: apps/homelab-ios
        run: |
          xcrun xcresulttool get build-results \
            --path build.xcresult --format json | head -c 20000
