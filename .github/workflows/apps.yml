name: Apps

# The mirror image of the `paths-ignore: ['apps/**']` blocks on `update.yml`
# and `build-mcp-arr.yml` (see ADR-0003). Those stop Swift commits deploying
# Ansible to six hosts; this is the half that actually checks the Swift.
#
# It cannot run on the `self-hosted` runner, which is Linux.
on:
  push:
    branches: [main]
    paths: ['apps/**', '.github/workflows/apps.yml']
  pull_request:
    paths: ['apps/**', '.github/workflows/apps.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.app

      # The shared package holds every testable decision in both apps, so this
      # is the job that matters.
      - name: Test HomelabCore
        working-directory: apps/homelab-core
        run: swift test

      # Contract tests are excluded by name: they hit the live API with the
      # token you signed in with, which CI has no way to hold.
      - name: Test the menu bar app
        working-directory: apps/homelab-menubar
        run: swift test --skip Contract

      - name: Build the menu bar app
        working-directory: apps/homelab-menubar
        run: swift build -c release --product HomelabMenuBar

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # `actool` refuses to compile an asset catalogue unless a simulator
      # runtime matching its SDK is installed — even for a device build, which
      # has no use for one. Xcode 16.0's SDK is iOS 18.0 and this image's
      # oldest runtime is 18.5, so the pin to Xcode 16.0 could never work here:
      #
      #     No simulator runtime version from [22F77, 22G86, 23A8464, 23B86,
      #     23C54] available to use with iphonesimulator SDK version 22A3362
      #
      # Xcode 16.4's SDK is 18.5, which is 22F77 — the first entry in that
      # list. Falling back to the image default rather than failing outright
      # keeps this working when 16.4 is eventually dropped.
      #
      # The `test` job stays on Xcode 16.0 deliberately: it is green there, it
      # builds nothing for iOS, and there is no reason to move a compiler
      # under a passing job.
      #
      # Everything is printed. When the image changes again, the log should
      # say what was available, not only what was missing.
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -switch /Applications/Xcode_16.4.app
          else
            echo "Xcode 16.4 is not installed; using the image default."
          fi
          xcodebuild -version
          xcrun simctl list runtimes || true

      # No test step: the iOS target is views and wiring over HomelabCore,
      # which the job above covers. A clean compile is what there is to prove.
      #
      # A generic destination rather than a named device: this only ever
      # compiles, and naming one ties the job to whichever simulators the
      # runner image happens to ship — which is how the first run of this
      # workflow failed, on a missing "iPhone 16", before building anything.
      #
      # `generic/platform=iOS` — a device — rather than `iOS Simulator`, so
      # that resolving the destination needs no simulator to exist. It is not
      # what fixed the runtime error above; `actool` wants a runtime whatever
      # the platform, which is why the Xcode selection is where that is dealt
      # with. With signing off, a device build compiles the same sources.
      - name: Build for iOS
        working-directory: apps/homelab-ios
        run: |
          xcodebuild build \
            -project Homelab.xcodeproj \
            -scheme Homelab \
            -destination 'generic/platform=iOS' \
            -resultBundlePath build.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # xcodebuild batches Swift compiles, and when one fails it can report
      # nothing but "Command SwiftCompile failed with a nonzero exit code" —
      # the diagnostics stay in the result bundle. Without this a red build
      # says only that something broke, not what, which cost several rounds.
      - name: Show build diagnostics
        if: failure()
        working-directory: apps/homelab-ios
        run: |
          xcrun xcresulttool get build-results \
            --path build.xcresult --format json | head -c 20000
