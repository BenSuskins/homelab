name: Service exposure

on:
  pull_request:
    paths:
      - 'config/traefik/**'
      - 'group_vars/**'
      - 'tasks/core/**'
      - 'tasks/docker/**'
      - 'terraform/cloudflare/**'
      - 'tests/validate-exposure.yml'
      - '.github/workflows/service-exposure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - name: Verify route exposure and public DNS
        run: ansible-playbook -i localhost, -c local tests/validate-exposure.yml
