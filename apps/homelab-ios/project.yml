# TEMPORARY — delete this file once Homelab.xcodeproj is committed.
#
# The project used to be generated from this spec and gitignored. It is now
# committed and is the source of truth, because Xcode Cloud (which deploys to
# TestFlight) discovers the project by scanning the repository and a generated
# one is not there to be found at setup time.
#
# This spec survives only to seed that first project:
#
#   cd apps/homelab-menubar && make ios-bootstrap-project
#   git add -A apps/homelab-ios && git commit
#   git rm apps/homelab-ios/project.yml     # and drop the Makefile target
#
# Do not re-run the generator afterwards: it would discard anything changed in
# Xcode. The bootstrap target refuses to run over an existing project for that
# reason.
name: Homelab
options:
  bundleIdPrefix: co.uk.suskins
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  HomelabCore:
    path: ../homelab-core

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc for a personal build; TestFlight replaces this with the team's.
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  HomelabApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/HomelabApp
    dependencies:
      - package: HomelabCore
        product: HomelabCore
      - target: HomelabWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.uk.suskins.Homelab
        PRODUCT_NAME: Homelab
        INFOPLIST_FILE: Sources/HomelabApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/HomelabApp/HomelabApp.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES

  HomelabWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/HomelabWidget
    dependencies:
      - package: HomelabCore
        product: HomelabCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.uk.suskins.Homelab.Widget
        PRODUCT_NAME: HomelabWidget
        INFOPLIST_FILE: Sources/HomelabWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/HomelabWidget/HomelabWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  Homelab:
    build:
      targets:
        HomelabApp: all
        HomelabWidget: all
    run:
      config: Debug
    test:
      config: Debug
