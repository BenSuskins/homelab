---
- name: FLARESOLVERR - Pre-pull image
  community.docker.docker_image:
    name: "{{ image }}"
    source: pull
    force_source: true
  vars:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2

- name: FLARESOLVERR - Create container
  community.docker.docker_container:
    name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    restart_policy: always
    state: started
    pull: false
    memory: 1g
    cpus: "1.0"
    networks:
      - name: homelab
    ports:
      - "8191:8191"
    env:
      TZ: "{{ timezone }}"

- name: FLARESOLVERR - Define service entry
  ansible.builtin.set_fact:
    flaresolverr_entry:
      name: flaresolverr
      ip: "{{ inventory_hostname }}"
      friendly_name: "{{ friendly_name }}"
      port: 8191
      scheme: http

- name: FLARESOLVERR - Append to docker_services
  ansible.builtin.set_fact:
    docker_services: "{{ docker_services + [flaresolverr_entry] }}"
