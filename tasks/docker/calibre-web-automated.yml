---
- name: CALIBRE WEB AUTOMATED - Create directory and permissions
  ansible.builtin.file:
    path: "{{ item }}"
    recurse: true
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0750"
  loop:
    - "{{ base_dir }}/calibre-web-automated"
    # CWA writes metadata.db but not the directory holding it, so the library
    # root has to exist before the container starts.
    - "{{ base_dir }}/calibre-web-automated/library"

- name: CALIBRE WEB AUTOMATED - Pre-pull image
  community.docker.docker_image:
    name: "{{ image }}"
    source: pull
    force_source: true
  vars:
    image: crocodilestick/calibre-web-automated:v4.0.6

- name: CALIBRE WEB AUTOMATED - Create container
  community.docker.docker_container:
    name: calibre-web-automated
    image: crocodilestick/calibre-web-automated:v4.0.6
    restart_policy: always
    state: started
    pull: false
    networks:
      - name: homelab
    ports:
      - "8083:8083"
    volumes:
      - "{{ base_dir }}/calibre-web-automated:/config"
      - "/mnt/media/books/data:/cwa-book-ingest"
      # metadata.db is SQLite, and calibredb - which CWA shells out to on every
      # ingest - does its own byte-range locking that CIFS cannot serve. On the
      # share that failed as `apsw.BusyError: database is locked`, so no book was
      # ever added. NETWORK_SHARE_MODE below does not reach that subprocess, so
      # the library has to sit on a real POSIX filesystem; only the ingest folder
      # stays on the NAS, where OpenBooks and Shelfmark write to it.
      - "{{ base_dir }}/calibre-web-automated/library:/calibre-library"
    env:
      TZ: "{{ timezone }}"
      PUID: "{{ puid | string }}"
      PGID: "{{ pgid | string }}"
      # The ingest folder is still on the TrueNAS CIFS share, where inotify
      # cannot see writes reliably, and this is what switches the ingest watcher
      # to polling. It also disables SQLite WAL, which is a small and acceptable
      # cost now that the library itself is on local disk.
      NETWORK_SHARE_MODE: "true"

- name: CALIBRE WEB AUTOMATED - Define service entry
  ansible.builtin.set_fact:
    calibre_web_automated_entry:
      name: calibre-web-automated
      description: eBook library
      icon: calibre-web
      host: "calibre.{{ domain }}"
      ip: "{{ inventory_hostname }}"
      friendly_name: "{{ friendly_name }}"
      port: 8083
      scheme: http
      secured: false
      healthcheck: true
      homepage: true
      proxied: true

- name: CALIBRE WEB AUTOMATED - Append to docker_services
  ansible.builtin.set_fact:
    docker_services: "{{ docker_services + [calibre_web_automated_entry] }}"
