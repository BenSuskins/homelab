---
- name: CALIBRE WEB AUTOMATED - Create directory and permissions
  ansible.builtin.file:
    path: "{{ item }}"
    recurse: true
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0750"
  loop:
    - "{{ base_dir }}/calibre-web-automated"

# CWA creates metadata.db but not the directory holding it, so the library root
# has to exist before the container starts. No owner/group/mode here: this path
# is on the CIFS mount, which is mounted uid=1000,gid=1000 and ignores chown and
# chmod, so setting them would fail rather than do anything.
- name: CALIBRE WEB AUTOMATED - Ensure library directory exists on the share
  ansible.builtin.file:
    path: /mnt/media/books/library
    state: directory

- name: CALIBRE WEB AUTOMATED - Pre-pull image
  community.docker.docker_image:
    name: "{{ image }}"
    source: pull
    force_source: true
  vars:
    image: crocodilestick/calibre-web-automated:v4.0.6

- name: CALIBRE WEB AUTOMATED - Create container
  community.docker.docker_container:
    name: calibre-web-automated
    image: crocodilestick/calibre-web-automated:v4.0.6
    restart_policy: always
    state: started
    pull: false
    networks:
      - name: homelab
    ports:
      - "8083:8083"
    volumes:
      - "{{ base_dir }}/calibre-web-automated:/config"
      - "/mnt/media/books/data:/cwa-book-ingest"
      - "/mnt/media/books/library:/calibre-library"
    env:
      TZ: "{{ timezone }}"
      PUID: "{{ puid | string }}"
      PGID: "{{ pgid | string }}"
      # The Calibre library lives on the TrueNAS CIFS share, and SMB does not
      # support the file locking SQLite's WAL mode needs - left on, it risks
      # "database is locked" errors and eventual metadata.db corruption. This
      # also swaps the inotify ingest watcher for polling, which is the only
      # option over CIFS, at the cost of a few seconds' latency on new files.
      NETWORK_SHARE_MODE: "true"

- name: CALIBRE WEB AUTOMATED - Define service entry
  ansible.builtin.set_fact:
    calibre_web_automated_entry:
      name: calibre-web-automated
      description: eBook library
      icon: calibre-web
      host: "calibre.{{ domain }}"
      ip: "{{ inventory_hostname }}"
      friendly_name: "{{ friendly_name }}"
      port: 8083
      scheme: http
      secured: false
      healthcheck: true
      homepage: true
      proxied: true

- name: CALIBRE WEB AUTOMATED - Append to docker_services
  ansible.builtin.set_fact:
    docker_services: "{{ docker_services + [calibre_web_automated_entry] }}"
