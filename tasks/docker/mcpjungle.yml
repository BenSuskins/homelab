---
- name: MCPJUNGLE - Create directory and permissions
  ansible.builtin.file:
    path: "{{ base_dir }}/mcpjungle"
    recurse: true
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0750"

- name: MCPJUNGLE - Pre-pull image
  community.docker.docker_image:
    name: "{{ image }}"
    source: pull
    force_source: true
  vars:
    image: mcpjungle/mcpjungle:latest

- name: MCPJUNGLE - Inspect existing container
  community.docker.docker_container_info:
    name: mcpjungle
  register: mcpjungle_existing_container

- name: MCPJUNGLE - Check for persistent database
  ansible.builtin.stat:
    path: "{{ base_dir }}/mcpjungle/mcpjungle.db"
  register: mcpjungle_persistent_database

- name: MCPJUNGLE - Copy existing database to persistent storage
  when:
    - mcpjungle_existing_container.exists
    - not mcpjungle_persistent_database.stat.exists
  block:
    - name: MCPJUNGLE - Create temporary migration directory
      ansible.builtin.tempfile:
        path: "{{ base_dir }}/mcpjungle"
        prefix: .migration-
        state: directory
      register: mcpjungle_migration_directory

    - name: MCPJUNGLE - Stop existing container for a consistent database copy
      ansible.builtin.command:
        argv:
          - docker
          - stop
          - mcpjungle
      changed_when: true
      when: mcpjungle_existing_container.container.State.Running

    - name: MCPJUNGLE - Copy database into persistent storage
      ansible.builtin.command:
        argv:
          - docker
          - cp
          - mcpjungle:/mcpjungle.db
          - "{{ mcpjungle_migration_directory.path }}/mcpjungle.db"
      changed_when: true

    - name: MCPJUNGLE - Copy database write-ahead log
      ansible.builtin.command:
        argv:
          - docker
          - cp
          - mcpjungle:/mcpjungle.db-wal
          - "{{ mcpjungle_migration_directory.path }}/mcpjungle.db-wal"
      changed_when: true

    - name: MCPJUNGLE - Install write-ahead log before database
      ansible.builtin.command:
        argv:
          - mv
          - --
          - "{{ mcpjungle_migration_directory.path }}/mcpjungle.db-wal"
          - "{{ base_dir }}/mcpjungle/mcpjungle.db-wal"
      changed_when: true

    - name: MCPJUNGLE - Install database after its write-ahead log
      ansible.builtin.command:
        argv:
          - mv
          - --
          - "{{ mcpjungle_migration_directory.path }}/mcpjungle.db"
          - "{{ base_dir }}/mcpjungle/mcpjungle.db"
      changed_when: true
  rescue:
    - name: MCPJUNGLE - Restart existing container after a failed database copy
      ansible.builtin.command:
        argv:
          - docker
          - start
          - mcpjungle
      changed_when: true
      when:
        - mcpjungle_existing_container.container.State.Running

    - name: MCPJUNGLE - Stop deployment after a failed database copy
      ansible.builtin.fail:
        msg: MCPJungle database migration failed; the existing database was not replaced.
  always:
    - name: MCPJUNGLE - Remove temporary migration directory
      ansible.builtin.file:
        path: "{{ mcpjungle_migration_directory.path }}"
        state: absent
      when: mcpjungle_migration_directory is defined

- name: MCPJUNGLE - Create container
  community.docker.docker_container:
    name: mcpjungle
    image: mcpjungle/mcpjungle:latest
    restart_policy: always
    state: started
    pull: false
    networks:
      - name: homelab
    ports:
      - "8090:8080"
    env:
      SQLITE_DB_PATH: /data/mcpjungle.db
    volumes:
      - "{{ base_dir }}/mcpjungle:/data"

- name: MCPJUNGLE - Define service entry
  ansible.builtin.set_fact:
    mcpjungle_entry:
      name: mcpjungle
      description: MCP gateway
      host: "mcp.{{ domain }}"
      ip: "{{ inventory_hostname }}"
      friendly_name: "{{ friendly_name }}"
      port: 8090
      scheme: http
      secured: true
      healthcheck: true
      healthcheck_path: /health
      homepage: true
      proxied: true

- name: MCPJUNGLE - Append to docker_services
  ansible.builtin.set_fact:
    docker_services: "{{ docker_services + [mcpjungle_entry] }}"
