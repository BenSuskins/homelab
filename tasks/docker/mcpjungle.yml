---
- name: MCPJUNGLE - Create directory and permissions
  ansible.builtin.file:
    path: "{{ base_dir }}/mcpjungle"
    recurse: true
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0750"

- name: MCPJUNGLE - Pre-pull image
  community.docker.docker_image:
    name: "{{ image }}"
    source: pull
    force_source: true
  vars:
    image: mcpjungle/mcpjungle:latest

- name: MCPJUNGLE - Create container
  community.docker.docker_container:
    name: mcpjungle
    image: mcpjungle/mcpjungle:latest
    restart_policy: always
    state: started
    pull: false
    networks:
      - name: homelab
    ports:
      - "8090:8080"
    volumes:
      - "{{ base_dir }}/mcpjungle:/data"

- name: MCPJUNGLE - Define service entry
  ansible.builtin.set_fact:
    mcpjungle_entry:
      name: mcpjungle
      description: MCP gateway
      host: "mcp.{{ domain }}"
      ip: "{{ inventory_hostname }}"
      friendly_name: "{{ friendly_name }}"
      port: 8090
      scheme: http
      secured: true
      healthcheck: true
      healthcheck_path: /health
      homepage: true
      proxied: true

- name: MCPJUNGLE - Append to docker_services
  ansible.builtin.set_fact:
    docker_services: "{{ docker_services + [mcpjungle_entry] }}"
