---
- name: ALLOY - Create directory and permissions
  ansible.builtin.file:
    path: "{{ item }}"
    recurse: true
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0750"
  loop:
    - "{{ base_dir }}/alloy/config"
    - "{{ base_dir }}/alloy/textfile"

- name: ALLOY - Create config
  ansible.builtin.copy:
    content: |
      // Logging configuration
      logging {
        level  = "info"
        format = "logfmt"
      }

      // Docker log collection
      discovery.docker "log_scrape" {
        host             = "unix:///var/run/docker.sock"
        refresh_interval = "5s"
      }

      discovery.relabel "log_scrape" {
        targets = []

        rule {
          source_labels = ["__meta_docker_container_name"]
          regex         = "/(.*)"
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_docker_container_log_stream"]
          target_label  = "logstream"
        }

        rule {
          source_labels = ["__meta_docker_container_label_logging_jobname"]
          target_label  = "job"
        }
      }

      loki.source.docker "log_scrape" {
        host             = "unix:///var/run/docker.sock"
        targets          = discovery.docker.log_scrape.targets
        forward_to       = [loki.write.default.receiver]
        relabel_rules    = discovery.relabel.log_scrape.rules
        refresh_interval = "5s"
      }

      loki.write "default" {
        endpoint {
          url = "http://{{ monitor_ip }}:3100/loki/api/v1/push"
        }
        external_labels = {}
      }

      // Container metrics (replaces cadvisor)
      prometheus.exporter.cadvisor "containers" {
        docker_host             = "unix:///var/run/docker.sock"
        docker_only             = true
        store_container_labels  = false
        storage_duration        = "5m"
      }

      prometheus.scrape "cadvisor" {
        targets         = prometheus.exporter.cadvisor.containers.targets
        forward_to      = [prometheus.relabel.set_instance.receiver]
        scrape_interval = "60s"
      }

      // Host metrics (replaces node_exporter)
      prometheus.exporter.unix "host" {
        procfs_path = "/host/proc"
        sysfs_path  = "/host/sys"
        rootfs_path = "/rootfs"

        textfile {
          directory = "/textfile"
        }
      }

      prometheus.scrape "unix" {
        targets         = prometheus.exporter.unix.host.targets
        forward_to      = [prometheus.relabel.set_instance.receiver]
        scrape_interval = "60s"
      }

      // Rewrite instance label to the host's inventory name so dashboards can filter/group by host
      prometheus.relabel "set_instance" {
        forward_to = [prometheus.remote_write.default.receiver]
        rule {
          target_label = "instance"
          replacement  = "{{ inventory_hostname }}"
        }
        rule {
          target_label = "host"
          replacement  = "{{ friendly_name }}"
        }
      }

      prometheus.remote_write "default" {
        endpoint {
          url = "http://{{ monitor_ip }}:9090/api/v1/write"
        }
      }
    dest: "{{ base_dir }}/alloy/config/config.alloy"
    owner: "{{ username }}"
    group: "{{ username }}"
  register: alloy_config

- name: ALLOY - Pre-pull image
  community.docker.docker_image:
    name: "{{ image }}"
    source: pull
    force_source: true
  vars:
    image: grafana/alloy:v1.19.2

- name: ALLOY - Create container
  community.docker.docker_container:
    name: alloy
    image: grafana/alloy:v1.19.2
    restart_policy: always
    state: started
    pull: false
    networks:
      - name: homelab
    command: run /etc/alloy/config/config.alloy --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "12345:12345"
    volumes:
      - "{{ base_dir }}/alloy/config:/etc/alloy/config"
      - "{{ base_dir }}/alloy/textfile:/textfile:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/:/rootfs:ro"
      - "/var/run:/var/run:ro"
      - "/sys:/host/sys:ro"
      - "/proc:/host/proc:ro"
      - "/var/lib/docker/:/var/lib/docker:ro"
      - "/dev/disk/:/dev/disk:ro"
      - "/sys/fs/cgroup:/sys/fs/cgroup:ro"

- name: ALLOY - Restart to apply config changes
  ansible.builtin.command: docker restart alloy
  when: alloy_config.changed
  changed_when: true

- name: ALLOY - Define service entry
  ansible.builtin.set_fact:
    alloy_entry:
      name: alloy
      ip: "{{ inventory_hostname }}"
      friendly_name: "{{ friendly_name }}"
      port: 12345
      scheme: http
      secured: false
      healthcheck: true
      healthcheck_path: /-/ready
      metrics: true

- name: ALLOY - Append to docker_services
  ansible.builtin.set_fact:
    docker_services: "{{ docker_services + [alloy_entry] }}"
