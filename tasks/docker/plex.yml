---
- name: PLEX - Create directory and permissions
  ansible.builtin.file:
    path: "{{ item }}"
    recurse: true
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0750"
  loop:
    - "{{ base_dir }}/plex"

- name: PLEX - Pre-pull image
  community.docker.docker_image:
    name: "{{ image }}"
    source: pull
    force_source: true
  vars:
    image: ghcr.io/linuxserver/plex:1.43.4

- name: PLEX - Create container
  community.docker.docker_container:
    name: plex
    image: ghcr.io/linuxserver/plex:1.43.4
    restart_policy: always
    state: started
    pull: false
    network_mode: host
    volumes:
      - "{{ base_dir }}/plex:/config"
      - "/mnt/media:/media"
    env:
      PUID: "{{ puid | string }}"
      PGID: "{{ pgid | string }}"
      TZ: "{{ timezone }}"
      VERSION: "docker"

- name: PLEX - Define service entry
  ansible.builtin.set_fact:
    plex_entry:
      name: plex
      description: Media streaming server
      host: "plex.{{ domain }}"
      ip: "{{ inventory_hostname }}"
      friendly_name: "{{ friendly_name }}"
      port: 32400
      healthcheck_path: '/identity'
      scheme: http
      secured: true
      healthcheck: true
      homepage: true
      proxied: true

- name: PLEX - Append to docker_services
  ansible.builtin.set_fact:
    docker_services: "{{ docker_services + [plex_entry] }}"
