---
- name: FAMILY-HUB - Create directory and permissions
  ansible.builtin.file:
    path: "{{ item }}"
    recurse: true
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0750"
  loop:
    - "{{ base_dir }}/family-hub"

- name: FAMILY-HUB - Pre-pull image
  community.docker.docker_image:
    name: "{{ image }}"
    source: pull
    force_source: true
  vars:
    image: ghcr.io/bensuskins/family-hub:latest

- name: FAMILY-HUB - Create container
  community.docker.docker_container:
    name: family-hub
    image: ghcr.io/bensuskins/family-hub:latest
    restart_policy: always
    state: started
    pull: false
    networks:
      - name: homelab
    volumes:
      - "{{ base_dir }}/family-hub:/data"
    ports:
      - "8081:8080"
    env:
      OIDC_ISSUER: "https://authelia.{{ domain }}"
      OIDC_REDIRECT_URL: "https://hub.{{ domain }}/auth/callback"
      SESSION_SECRET: "{{ SESSION_SECRET }}"
      SESSION_ENCRYPTION_KEY: "{{ SESSION_ENCRYPTION_KEY }}"
      HUXLEY_ACCESS_TOKEN: "{{ HUB_HUXLEY_ACCESS_TOKEN }}"
      GOOGLE_MAPS_API_KEY: "{{ HUB_GOOGLE_MAPS_API_KEY }}"
      OIDC_CLIENT_ID: "family-hub"
      DATABASE_PATH: /data/family-hub.db

- name: FAMILY-HUB - Define service entry
  ansible.builtin.set_fact:
    family_hub_entry:
      name: family-hub
      description: Family dashboard
      icon: homehub
      host: hub.{{ domain }}
      ip: "{{ inventory_hostname }}"
      friendly_name: "{{ friendly_name }}"
      port: 8081
      scheme: http
      homepage: true
      secured: false
      healthcheck: true
      proxied: true
      healthcheck_path: "/health"
      # metrics: not enabled — GET /actuator/prometheus returns a Go-style
      # "404 page not found" (not Spring Boot's JSON 404), confirmed live
      # against 192.168.0.202:8081 during the grafana-monitoring-overhaul PR.
      # The app does not expose Micrometer/actuator endpoints; re-check if
      # family-hub ever adds them.

- name: FAMILY-HUB - Append to docker_services
  ansible.builtin.set_fact:
    docker_services: "{{ docker_services + [family_hub_entry] }}"
