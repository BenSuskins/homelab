---
- name: MEDIA-SERVER-MCP - Clear cached GHCR credentials
  community.docker.docker_login:
    registry_url: ghcr.io
    state: absent

- name: MEDIA-SERVER-MCP - Pre-pull image
  community.docker.docker_image:
    name: "{{ image }}"
    source: pull
    force_source: true
  vars:
    image: ghcr.io/bensuskins/media-server-mcp:latest

- name: MEDIA-SERVER-MCP - Create container
  community.docker.docker_container:
    name: media-server-mcp
    image: ghcr.io/bensuskins/media-server-mcp:latest
    restart_policy: always
    state: started
    pull: false
    networks:
      - name: homelab
    ports:
      - "3200:3000"
    env:
      SONARR_URL: "http://{{ mediaserver_ip }}:8989"
      SONARR_API_KEY: "{{ SONARR_API_KEY }}"
      RADARR_URL: "http://{{ mediaserver_ip }}:7878"
      RADARR_API_KEY: "{{ RADARR_API_KEY }}"
      MCP_AUTH_TOKEN: "{{ MEDIA_SERVER_MCP_AUTH_TOKEN }}"
      PLEX_URL: "http://{{ mediaserver_ip }}:32400"
      PLEX_API_KEY: "{{ PLEX_API_KEY }}"
      TMDB_API_KEY: "{{ TMDB_API_KEY }}"

- name: MEDIA-SERVER-MCP - Define service entry
  ansible.builtin.set_fact:
    media_server_mcp_entry:
      name: media-server-mcp
      description: Media server MCP (Sonarr/Radarr)
      ip: "{{ inventory_hostname }}"
      friendly_name: "{{ friendly_name }}"
      port: 3200
      scheme: http
      healthcheck: true
      healthcheck_path: /health

- name: MEDIA-SERVER-MCP - Append to docker_services
  ansible.builtin.set_fact:
    docker_services: "{{ docker_services + [media_server_mcp_entry] }}"
