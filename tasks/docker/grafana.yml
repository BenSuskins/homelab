---
- name: GRAFANA - Create directory and permissions
  ansible.builtin.file:
    path: "{{ item }}"
    recurse: true
    state: directory
    owner: "472"
    group: "472"
    mode: "0755"
  loop:
    - "{{ base_dir }}/grafana"
    - "{{ base_dir }}/grafana/dashboards"
    - "{{ base_dir }}/grafana/provisioning"

# Old flat-copied JSONs at the dashboards root would duplicate UIDs with the
# subdirectory copies below (provisioning now folds folder structure into
# Grafana folders), causing provisioning errors. The root of the tree only
# legitimately holds subdirectories from now on, so this stays safe to run
# every time.
- name: GRAFANA - Find stray dashboard files at the dashboards root
  ansible.builtin.find:
    paths: "{{ base_dir }}/grafana/dashboards"
    recurse: false
    patterns: "*.json"
  register: grafana_stray_dashboards

- name: GRAFANA - Remove stray dashboard files at the dashboards root
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ grafana_stray_dashboards.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: GRAFANA - Copy dashboards
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../config/grafana/dashboards/"
    dest: "{{ base_dir }}/grafana/dashboards/"
    owner: "472"
    group: "472"
    mode: "0644"
  register: grafana_dashboards

# `copy` never deletes, so a dashboard renamed or removed in the repo would
# linger on the host forever and be provisioned alongside its replacement -
# two dashboards, one stale. Reconcile the host against the repo every run.
# `fileglob` cannot do multi-level globs like */*.json - it silently returns an
# empty list, which made the reconcile below classify every dashboard on the
# host as stale and delete all of them. Enumerate the repo with `find` on the
# controller instead, and refuse to reconcile against an empty list.
- name: GRAFANA - Find dashboards in the repo
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/../config/grafana/dashboards"
    recurse: true
    patterns: "*.json"
  delegate_to: localhost
  become: false
  changed_when: false
  register: grafana_repo_dashboards

- name: GRAFANA - Refuse to reconcile against an empty repo dashboard list
  ansible.builtin.assert:
    that: grafana_repo_dashboards.files | length > 0
    fail_msg: >-
      Found no dashboards under config/grafana/dashboards. Refusing to
      reconcile, because that would delete every dashboard on the host.

- name: GRAFANA - Find dashboards present on the host
  ansible.builtin.find:
    paths: "{{ base_dir }}/grafana/dashboards"
    recurse: true
    patterns: "*.json"
  changed_when: false
  register: grafana_host_dashboards

- name: GRAFANA - Remove dashboards no longer in the repo
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ grafana_host_dashboards.files | map(attribute='path')
       | reject('in', repo_dashboards) | list }}
  vars:
    repo_dashboards: >-
      {{ grafana_repo_dashboards.files | map(attribute='path')
         | map('regex_replace', '^.*/config/grafana/dashboards/',
               base_dir ~ '/grafana/dashboards/') | list }}
  loop_control:
    label: "{{ item }}"
  register: grafana_removed_dashboards

- name: GRAFANA - Copy provisioning
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../config/grafana/provisioning/"
    dest: "{{ base_dir }}/grafana/provisioning/"
    owner: "472"
    group: "472"
    mode: "0644"
  register: grafana_provisioning

# Contact points and notification policies hold the Discord webhook, so they are
# templated from config/grafana/templates/ rather than copied with the rest of
# the provisioning tree. Both render fine when GRAFANA_ALERT_DISCORD_URL is
# absent - Grafana falls back to the email contact point.
- name: GRAFANA - Template alerting contact points and policies
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../config/grafana/templates/{{ item }}.j2"
    dest: "{{ base_dir }}/grafana/provisioning/alerting/{{ item }}"
    owner: "472"
    group: "472"
    mode: "0640"
  loop:
    - contact-points.yml
    - policies.yml
  register: grafana_alerting

- name: GRAFANA - Pre-pull image
  community.docker.docker_image:
    name: "{{ image }}"
    source: pull
    force_source: true
  vars:
    image: grafana/grafana:13.2.1

- name: GRAFANA - Create container
  community.docker.docker_container:
    name: grafana
    image: grafana/grafana:13.2.1
    restart_policy: always
    state: started
    pull: false
    ports:
      - "3000:3000"
    networks:
      - name: homelab
    volumes:
      - "{{ base_dir }}/grafana:/var/lib/grafana"
      - "{{ base_dir }}/grafana/provisioning:/etc/grafana/provisioning:ro"
    env:
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: "authelia"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana"
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ AUTHELIA_OIDC_GRAFANA_SECRET }}"
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email groups"
      GF_AUTH_GENERIC_OAUTH_EMPTY_SCOPES: "false"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://authelia.{{ domain }}/api/oidc/authorization"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://authelia.{{ domain }}/api/oidc/token"
      GF_AUTH_GENERIC_OAUTH_API_URL: "https://authelia.{{ domain }}/api/oidc/userinfo/"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: "preferred_username"
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: "name"
      GF_AUTH_GENERIC_OAUTH_GROUP_ATTRIBUTE_PATH: "groups"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      GF_AUTH_GENERIC_OAUTH_SKIP_ORG_ROLE_SYNC: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: "Admin"
      GF_AUTH_GENERIC_OAUTH_AUTH_STYLE: "InHeader"
      GF_AUTH_OAUTH_AUTO_LOGIN: "true"
      GF_SERVER_ROOT_URL: "https://grafana.{{ domain }}"
      GF_USERS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/Overview/homelab-overview.json"

- name: GRAFANA - Restart to apply provisioning changes
  ansible.builtin.command: docker restart grafana
  when: >-
    grafana_provisioning.changed or grafana_dashboards.changed
    or grafana_alerting.changed or grafana_removed_dashboards.changed
  changed_when: true

- name: GRAFANA - Define service entry
  ansible.builtin.set_fact:
    grafana_entry:
      name: grafana
      description: Observability dashboards
      host: "grafana.{{ domain }}"
      ip: "{{ inventory_hostname }}"
      friendly_name: "{{ friendly_name }}"
      port: 3000
      healthcheck_path: '/api/health'
      scheme: http
      secured: true
      healthcheck: true
      homepage: true
      proxied: true
      metrics: true

- name: GRAFANA - Append to docker_services
  ansible.builtin.set_fact:
    docker_services: "{{ docker_services + [grafana_entry] }}"
