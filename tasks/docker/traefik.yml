---
- name: TRAEFIK - Validate DNS token
  ansible.builtin.assert:
    that:
      - TRAEFIK_CLOUDFLARE_DNS_API_TOKEN is defined
      - TRAEFIK_CLOUDFLARE_DNS_API_TOKEN | length > 0
    fail_msg: Set TRAEFIK_CLOUDFLARE_DNS_API_TOKEN in the Ansible vault before deployment.
  no_log: true

- name: TRAEFIK - Create directories and set permissions
  ansible.builtin.file:
    path: "{{ item }}"
    recurse: true
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0750"
  loop:
    - "{{ base_dir }}/traefik"
    - "{{ base_dir }}/traefik/dynamic"
    - "{{ base_dir }}/traefik/logs"

- name: TRAEFIK - Create ACME storage directory
  ansible.builtin.file:
    path: "{{ base_dir }}/traefik/acme"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0700"

- name: TRAEFIK - Initialize ACME storage
  ansible.builtin.copy:
    content: ""
    dest: "{{ base_dir }}/traefik/acme/acme.json"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0600"
    force: false

- name: TRAEFIK - Protect ACME storage
  ansible.builtin.file:
    path: "{{ base_dir }}/traefik/acme/acme.json"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0600"

- name: TRAEFIK - Aggregate services from all hosts
  ansible.builtin.include_tasks:
    file: "../tasks/core/aggregate_services.yml"

- name: TRAEFIK - Validate public DNS and routes
  ansible.builtin.include_tasks:
    file: "../tasks/core/validate_public_web.yml"

- name: TRAEFIK - Create config
  ansible.builtin.template:
    src: ../config/traefik/traefik.toml.j2
    dest: "{{ base_dir }}/traefik/traefik.toml"
    owner: "{{ username }}"
    group: "{{ username }}"

- name: TRAEFIK - Create ratelimit middleware
  ansible.builtin.copy:
    src: ../config/traefik/dynamic/middlewares-ratelimit.toml
    dest: "{{ base_dir }}/traefik/dynamic/middlewares-ratelimit.toml"
    owner: "{{ username }}"
    group: "{{ username }}"

- name: TRAEFIK - Create unifi middleware
  ansible.builtin.copy:
    src: ../config/traefik/dynamic/middlewares-unifi.toml
    dest: "{{ base_dir }}/traefik/dynamic/middlewares-unifi.toml"
    owner: "{{ username }}"
    group: "{{ username }}"

- name: TRAEFIK - Create authelia middleware
  ansible.builtin.copy:
    src: ../config/traefik/dynamic/middlewares-authelia.toml
    dest: "{{ base_dir }}/traefik/dynamic/middlewares-authelia.toml"
    owner: "{{ username }}"
    group: "{{ username }}"

- name: TRAEFIK - Create security headers middleware
  ansible.builtin.copy:
    src: ../config/traefik/dynamic/middlewares-security.toml
    dest: "{{ base_dir }}/traefik/dynamic/middlewares-security.toml"
    owner: "{{ username }}"
    group: "{{ username }}"

- name: TRAEFIK - Create ssl
  ansible.builtin.copy:
    src: ../config/traefik/dynamic/ssl.toml
    dest: "{{ base_dir }}/traefik/dynamic/ssl.toml"
    owner: "{{ username }}"
    group: "{{ username }}"

- name: TRAEFIK - Create services
  ansible.builtin.template:
    src: ../config/traefik/dynamic/http.yml.j2
    dest: "{{ base_dir }}/traefik/dynamic/http.yml"
    owner: "{{ username }}"
    group: "{{ username }}"

- name: TRAEFIK - Pre-pull image
  community.docker.docker_image:
    name: "{{ image }}"
    source: pull
    force_source: true
  vars:
    image: "traefik:v3.7"

- name: TRAEFIK - Deploy container
  no_log: true
  community.docker.docker_container:
    name: traefik
    image: "traefik:v3.7"
    restart_policy: always
    state: started
    pull: false
    networks:
      - name: homelab
    entrypoint: /usr/local/bin/traefik
    command: "--configFile=/etc/traefik/traefik.toml"
    ports:
      - "80:80"
      - "443:443"
      - "8082:8082"
    volumes:
      - "{{ base_dir }}/traefik:/etc/traefik"
      - "{{ base_dir }}/traefik/logs:/logs"
    env:
      TZ: "{{ timezone }}"
      CF_DNS_API_TOKEN: "{{ TRAEFIK_CLOUDFLARE_DNS_API_TOKEN }}"

- name: TRAEFIK - Define service entry
  ansible.builtin.set_fact:
    traefik_entry:
      name: traefik
      description: Reverse proxy
      host: "traefik.{{ domain }}"
      ip: "{{ inventory_hostname }}"
      friendly_name: "{{ friendly_name }}"
      port: 8082
      scheme: http
      secured: true
      healthcheck: true
      healthcheck_path: '/ping'
      homepage: true
      proxied: true
      metrics: true
      metrics_port: 8082

- name: TRAEFIK - Append to docker_services
  ansible.builtin.set_fact:
    docker_services: "{{ docker_services + [traefik_entry] }}"
