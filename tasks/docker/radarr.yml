---
- name: RADARR - Create directory and permissions
  ansible.builtin.file:
    path: "{{ item }}"
    recurse: true
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0750"
  loop:
    - "{{ base_dir }}/radarr"

- name: RADARR - Pre-pull image
  community.docker.docker_image:
    name: "{{ image }}"
    source: pull
    force_source: true
  vars:
    image: ghcr.io/linuxserver/radarr:6.4.4

- name: RADARR - Create container
  community.docker.docker_container:
    name: radarr
    image: ghcr.io/linuxserver/radarr:6.4.4
    restart_policy: always
    state: started
    pull: false
    networks:
      - name: homelab
    ports:
      - "7878:7878"
    volumes:
      - "{{ base_dir }}/radarr:/config"
      - "/mnt/media:/media"
    env:
      PUID: "{{ puid | string }}"
      PGID: "{{ pgid | string }}"
      TZ: "{{ timezone }}"

- name: RADARR - Define service entry
  ansible.builtin.set_fact:
    radarr_entry:
      name: radarr
      description: Movie management
      host: "radarr.{{ domain }}"
      ip: "{{ inventory_hostname }}"
      friendly_name: "{{ friendly_name }}"
      port: 7878
      scheme: http
      secured: true
      healthcheck: true
      homepage: true
      proxied: true

- name: RADARR - Append to docker_services
  ansible.builtin.set_fact:
    docker_services: "{{ docker_services + [radarr_entry] }}"
