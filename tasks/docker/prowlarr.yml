---
- name: PROWLARR - Create directory and permissions
  ansible.builtin.file:
    path: "{{ item }}"
    recurse: true
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0750"
  loop:
    - "{{ base_dir }}/prowlarr"

- name: PROWLARR - Pre-pull image
  community.docker.docker_image:
    name: "{{ image }}"
    source: pull
    force_source: true
  vars:
    image: ghcr.io/linuxserver/prowlarr:2.6.5

- name: PROWLARR - Create container
  community.docker.docker_container:
    name: prowlarr
    image: ghcr.io/linuxserver/prowlarr:2.6.5
    restart_policy: always
    state: started
    pull: false
    networks:
      - name: homelab
    ports:
      - "9696:9696"
    volumes:
      - "{{ base_dir }}/prowlarr:/config"
    env:
      PUID: "{{ puid | string }}"
      PGID: "{{ pgid | string }}"
      TZ: "{{ timezone }}"

- name: PROWLARR - Define service entry
  ansible.builtin.set_fact:
    prowlarr_entry:
      name: prowlarr
      description: Indexer management
      host: "prowlarr.{{ domain }}"
      ip: "{{ inventory_hostname }}"
      friendly_name: "{{ friendly_name }}"
      port: 9696
      scheme: http
      secured: true
      healthcheck: true
      homepage: true
      proxied: true

- name: PROWLARR - Append to docker_services
  ansible.builtin.set_fact:
    docker_services: "{{ docker_services + [prowlarr_entry] }}"
