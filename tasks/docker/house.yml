---
- name: HOUSE - Create directory and permissions
  ansible.builtin.file:
    path: "{{ base_dir }}/house"
    recurse: true
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0750"

- name: HOUSE - Pre-pull image
  community.docker.docker_image:
    name: "{{ image }}"
    source: pull
    force_source: true
  vars:
    image: ghcr.io/bensuskins/house:latest

- name: HOUSE - Create container
  community.docker.docker_container:
    name: house
    image: ghcr.io/bensuskins/house:latest
    restart_policy: always
    state: started
    pull: false
    user: "{{ puid }}:{{ pgid }}"
    networks:
      - name: homelab
    volumes:
      - "{{ base_dir }}/house:/data"
    ports:
      - "8791:8080"
    env:
      TZ: "{{ timezone }}"
      HOUSE_DB_PATH: /data/house.db

- name: HOUSE - Define service entry
  ansible.builtin.set_fact:
    house_entry:
      name: house
      description: House design studio
      icon: mdi-home-edit
      host: "house.{{ domain }}"
      ip: "{{ inventory_hostname }}"
      friendly_name: "{{ friendly_name }}"
      port: 8791
      scheme: http
      secured: true
      proxied: true
      homepage: true
      healthcheck: true
      healthcheck_path: /healthz

- name: HOUSE - Append to docker_services
  ansible.builtin.set_fact:
    docker_services: "{{ docker_services + [house_entry] }}"
