---
- name: LOKI - Create directory and permissions
  ansible.builtin.file:
    path: "{{ item }}"
    recurse: true
    state: directory
    owner: "10001"
    group: "10001"
    mode: "0755"
  loop:
    - "{{ base_dir }}/loki"
    - "{{ base_dir }}/loki/config"
    - "{{ base_dir }}/loki/data"

- name: LOKI - Create config
  ansible.builtin.copy:
    content: |
      auth_enabled: false

      server:
        http_listen_port: 3100

      common:
        instance_addr: 127.0.0.1
        path_prefix: /loki
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory

      schema_config:
        configs:
          - from: 2020-10-24
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      ruler:
        alertmanager_url: http://localhost:9093

      limits_config:
        reject_old_samples: false
        retention_period: 30d

      compactor:
        working_directory: /loki/compactor
        compaction_interval: 10m
        retention_enabled: true
        retention_delete_delay: 2h
        retention_delete_worker_count: 50
        delete_request_store: filesystem
    dest: "{{ base_dir }}/loki/config/local-config.yaml"
    owner: "{{ username }}"
    group: "{{ username }}"
  register: loki_config

- name: LOKI - Pre-pull image
  community.docker.docker_image:
    name: "{{ image }}"
    source: pull
    force_source: true
  vars:
    image: grafana/loki:3.7.7

- name: LOKI - Create container
  community.docker.docker_container:
    name: loki
    image: grafana/loki:3.7.7
    restart_policy: always
    state: started
    pull: false
    ports:
      - "3100:3100"
    networks:
      - name: homelab
    volumes:
      - "{{ base_dir }}/loki/config:/etc/loki"
      - "{{ base_dir }}/loki/data:/loki"

- name: LOKI - Restart to apply config changes
  ansible.builtin.command: docker restart loki
  when: loki_config.changed
  changed_when: true

- name: LOKI - Define service entry
  ansible.builtin.set_fact:
    loki_entry:
      name: loki
      host: "loki.{{ domain }}"
      ip: "{{ inventory_hostname }}"
      friendly_name: "{{ friendly_name }}"
      port: 3100
      scheme: http
      healthcheck: true
      healthcheck_path: "/ready"
      secured: false
      metrics: true

- name: LOKI - Append to docker_services
  ansible.builtin.set_fact:
    docker_services: "{{ docker_services + [loki_entry] }}"
