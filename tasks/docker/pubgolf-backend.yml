---
- name: PUBGOLF-BACKEND - Create directory and permissions
  ansible.builtin.file:
    path: "{{ item }}"
    recurse: true
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0750"
  loop:
    - "{{ base_dir }}/pubgolf-go"

- name: PUBGOLF-BACKEND - Pre-pull image
  community.docker.docker_image:
    name: "{{ image }}"
    source: pull
    force_source: true
  vars:
    image: ghcr.io/bensuskins/pubgolf-backend:50041b95b3dd74c4b88a9dd8be830e763cdf393c

# Pull both release images before changing the API to avoid a partial cutover
# when the matching frontend image is unavailable.
- name: PUBGOLF-BACKEND - Pre-pull matching frontend image
  community.docker.docker_image:
    name: "{{ image }}"
    source: pull
    force_source: true
  vars:
    image: ghcr.io/bensuskins/pubgolf-frontend:50041b9

- name: PUBGOLF-BACKEND - Create container
  community.docker.docker_container:
    name: pubgolf-backend
    image: ghcr.io/bensuskins/pubgolf-backend:50041b95b3dd74c4b88a9dd8be830e763cdf393c
    restart_policy: always
    state: started
    pull: false
    # Match bind-mount ownership instead of the image's internal pubgolf UID.
    user: "{{ puid }}:{{ pgid }}"
    networks:
      - name: homelab
    volumes:
      - "{{ base_dir }}/pubgolf-go:/data"
    ports:
      - "8080:8080"
    env:
      DATABASE_PATH: /data/pubgolf-go.db

- name: PUBGOLF-BACKEND - Wait for Go API health before updating frontend
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/actuator/health
    return_content: true
  register: pubgolf_backend_health
  until:
    - pubgolf_backend_health.status | default(0) == 200
    - (pubgolf_backend_health.json | default({})).get('status') == 'UP'
  retries: 20
  delay: 3
  when: not ansible_check_mode

- name: PUBGOLF-BACKEND - Define service entry
  ansible.builtin.set_fact:
    pubgolf_backend_entry:
      name: pubgolf-backend
      host: api.pubgolf.me
      ip: "{{ inventory_hostname }}"
      friendly_name: "{{ friendly_name }}"
      port: 8080
      scheme: http
      secured: false
      healthcheck: true
      healthcheck_path: "/actuator/health"
      proxied: true
      path_prefix: /api/v1
      metrics: true
      metrics_port: 8080
      metrics_path: /actuator/prometheus

- name: PUBGOLF-BACKEND - Append to docker_services
  ansible.builtin.set_fact:
    docker_services: "{{ docker_services + [pubgolf_backend_entry] }}"
