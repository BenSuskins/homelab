---
- name: HOMEPAGE - Create directory and permissions
  ansible.builtin.file:
    path: "{{ item }}"
    recurse: true
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0750"
  loop:
    - "{{ base_dir }}/homepage"

- name: HOMEPAGE - Aggregate services from all hosts
  ansible.builtin.include_tasks:
    file: "../tasks/core/aggregate_services.yml"

- name: HOMEPAGE - Create bookmarks
  ansible.builtin.copy:
    src: ../config/homepage/bookmarks.yaml
    dest: "{{ base_dir }}/homepage/bookmarks.yaml"
    owner: "{{ username }}"
    group: "{{ username }}"

- name: HOMEPAGE - Create services
  ansible.builtin.template:
    src: ../config/homepage/services.yaml.j2
    dest: "{{ base_dir }}/homepage/services.yaml"
    owner: "{{ username }}"
    group: "{{ username }}"

- name: HOMEPAGE - Create settings
  ansible.builtin.copy:
    src: ../config/homepage/settings.yaml
    dest: "{{ base_dir }}/homepage/settings.yaml"
    owner: "{{ username }}"
    group: "{{ username }}"

- name: HOMEPAGE - Create widgets
  ansible.builtin.copy:
    src: ../config/homepage/widgets.yaml
    dest: "{{ base_dir }}/homepage/widgets.yaml"
    owner: "{{ username }}"
    group: "{{ username }}"

- name: HOMEPAGE - Pre-pull image
  community.docker.docker_image:
    name: "{{ image }}"
    source: pull
    force_source: true
  vars:
    image: ghcr.io/gethomepage/homepage:v2.2.0

- name: HOMEPAGE - Create container
  community.docker.docker_container:
    name: homepage
    image: ghcr.io/gethomepage/homepage:v2.2.0
    restart_policy: always
    state: started
    pull: false
    env:
      HOMEPAGE_ALLOWED_HOSTS: "{{ docker_ip }}:3000,home.{{ domain }}"
      # Homepage v2 adds its own password/OIDC gate behind HOMEPAGE_AUTH_ENABLED.
      # Leave it off: Traefik already sends home.{{ domain }} through the authelia
      # middleware. Note this gates the proxied host only, not port 3000 on the
      # LAN or tailnet. To close that, add homepage as an authelia OIDC client
      # rather than using password mode, which would ask for a second login.
    networks:
      - name: homelab
    ports:
      - "3000:3000"
    volumes:
      - "{{ base_dir }}/homepage:/app/config"
