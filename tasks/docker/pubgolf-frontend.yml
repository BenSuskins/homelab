---
- name: PUBGOLF-FRONTEND - Pre-pull image
  community.docker.docker_image:
    name: "{{ image }}"
    source: pull
    force_source: true
  vars:
    image: ghcr.io/bensuskins/pubgolf-frontend:latest

- name: PUBGOLF-FRONTEND - Create container
  community.docker.docker_container:
    name: pubgolf-frontend
    image: ghcr.io/bensuskins/pubgolf-frontend:latest
    restart_policy: always
    state: started
    pull: false
    networks:
      - name: homelab
    ports:
      - "3003:3000"
    env:
      NEXT_PUBLIC_API_URL: "https://api.pubgolf.me"

- name: PUBGOLF - Define service entry
  ansible.builtin.set_fact:
    pubgolf_entry:
      name: pubgolf
      host: pubgolf.me
      ip: "{{ inventory_hostname }}"
      friendly_name: "{{ friendly_name }}"
      port: 3003
      scheme: http
      secured: false
      healthcheck: true
      proxied: true

- name: PUBGOLF - Append to docker_services
  ansible.builtin.set_fact:
    docker_services: "{{ docker_services + [pubgolf_entry] }}"
