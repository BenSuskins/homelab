---
- name: PUBGOLF-FRONTEND - Pre-pull image
  community.docker.docker_image:
    name: "{{ image }}"
    source: pull
    force_source: true
  vars:
    image: ghcr.io/bensuskins/pubgolf-frontend:50041b9

- name: PUBGOLF-FRONTEND - Create container
  community.docker.docker_container:
    name: pubgolf-frontend
    image: ghcr.io/bensuskins/pubgolf-frontend:50041b9
    restart_policy: always
    state: started
    pull: false
    networks:
      - name: homelab
    ports:
      - "3003:3000"
    env:
      NEXT_PUBLIC_API_URL: "https://api.pubgolf.me"

- name: PUBGOLF-FRONTEND - Wait for frontend health
  ansible.builtin.uri:
    url: http://127.0.0.1:3003/
  register: pubgolf_frontend_health
  until: pubgolf_frontend_health.status | default(0) == 200
  retries: 20
  delay: 3
  when: not ansible_check_mode

- name: PUBGOLF - Define service entry
  ansible.builtin.set_fact:
    pubgolf_entry:
      name: pubgolf
      host: pubgolf.me
      ip: "{{ inventory_hostname }}"
      friendly_name: "{{ friendly_name }}"
      port: 3003
      scheme: http
      secured: false
      healthcheck: true
      proxied: true

- name: PUBGOLF - Append to docker_services
  ansible.builtin.set_fact:
    docker_services: "{{ docker_services + [pubgolf_entry] }}"
