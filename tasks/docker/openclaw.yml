---
# OpenClaw runs as uid 1000 (`node`) inside the image and will not start if the
# bind mounts are owned by anyone else, so the ownership here is the numeric uid
# rather than {{ username }} — it has to match the container's user, not the host's.
#
# Deliberately not recursive: OpenClaw owns everything under these paths at
# runtime (workspace files, plugin installs, browser caches), and re-applying a
# directory mode across that tree every run would both churn and flip
# openclaw.json back to 0750.
- name: OPENCLAW - Create directories and permissions
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0750"
  loop:
    - "{{ base_dir }}/openclaw/state"
    - "{{ base_dir }}/openclaw/auth"

- name: OPENCLAW - Pre-pull image
  community.docker.docker_image:
    name: "{{ image }}"
    source: pull
    force_source: true
  register: openclaw_image
  vars:
    image: ghcr.io/openclaw/openclaw:2026.8.1

- name: OPENCLAW - Check whether the gateway has been onboarded
  ansible.builtin.stat:
    path: "{{ base_dir }}/openclaw/state/openclaw.json"
  register: openclaw_config

# openclaw.json is seeded by OpenClaw's own headless onboarding rather than
# templated here. Hand-authoring it against a schema that refuses to start on a
# missing or unknown key is what produced #169 (gateway.mode), #170
# (allowedOrigins) and #171 (gateway.bind) — three crash loops in three days.
# Onboarding writes a config its own validator accepts.
#
# The trade is that the config is host state after this: OpenClaw and the
# Control UI own it, Ansible seeds it once and does not reconcile it. Changing a
# seeded value on a live host is `openclaw config set`, not an edit here.
#
# --secret-input-mode ref stores credentials as env SecretRefs rather than
# copying them into the file: the auth profile gets a keyRef naming
# OPENROUTER_API_KEY, and --gateway-token-ref-env does the same for
# gateway.auth.token. Both env vars have to be present in this one-shot, which
# is why they are passed here as well as to the container below.
#
# --skip-health because the gateway is not running yet; --no-install-daemon
# because Docker supervises it; --skip-channels/-search/-hooks/-ui because this
# is a dashboard-only deployment with no messaging channels.
- name: OPENCLAW - Seed configuration with headless onboarding
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --init
      - --security-opt=no-new-privileges:true
      - --cap-drop=NET_RAW
      - --cap-drop=NET_ADMIN
      - --env=HOME=/home/node
      - --env=OPENCLAW_HOME=/home/node
      - --env=OPENCLAW_STATE_DIR=/home/node/.openclaw
      - --env=OPENCLAW_CONFIG_DIR=/home/node/.openclaw
      - --env=OPENCLAW_CONFIG_PATH=/home/node/.openclaw/openclaw.json
      - --env=OPENCLAW_WORKSPACE_DIR=/home/node/.openclaw/workspace
      - --env=OPENCLAW_SUPERVISOR_MODE=external
      # Value-less --env forwards from this task's own environment below, so
      # neither secret is ever part of the command line Ansible would echo.
      - --env=OPENCLAW_GATEWAY_TOKEN
      - --env=OPENROUTER_API_KEY
      - "--volume={{ base_dir }}/openclaw/state:/home/node/.openclaw"
      - "--volume={{ base_dir }}/openclaw/auth:/home/node/.config/openclaw"
      - "{{ openclaw_image.image.Id }}"
      - node
      - dist/index.js
      - onboard
      - --non-interactive
      - --accept-risk
      - --mode=local
      - --auth-choice=openrouter-api-key
      - --secret-input-mode=ref
      - --gateway-auth=token
      - --gateway-token-ref-env=OPENCLAW_GATEWAY_TOKEN
      - --skip-health
      - --no-install-daemon
      - --skip-channels
      - --skip-search
      - --skip-hooks
      - --skip-ui
  environment:
    OPENCLAW_GATEWAY_TOKEN: "{{ OPENCLAW_GATEWAY_TOKEN }}"
    OPENROUTER_API_KEY: "{{ OPENROUTER_API_KEY }}"
  when: not openclaw_config.stat.exists
  changed_when: true

# Onboarding writes gateway.mode itself but knows nothing about how this
# deployment is published, so the shape keys are set immediately after it, in
# the same seed. This is the flow upstream's own Docker guide uses.
#
# bind=lan because the container publishes a port and the loopback default would
# make it unreachable. publicOrigin and allowedOrigins are the Traefik hostname:
# the first is what 2.0 stamps into Control UI deep links, the second is the
# browser-origin allowlist for WebSocket connects.
#
# perplexity is denied because OPENROUTER_API_KEY is one of the env vars its
# manifest declares for its provider, which is enough for 2.0 to treat it as
# configured and try to install it from the official catalog. That install needs
# capability consent no headless run can give, the unconsented install fails
# plugin verification, and 2.0 then refuses to report the gateway ready — a
# crash loop under restart_policy: always. A denied plugin resolves to disabled,
# so its verification failure never counts as active. Consent is the wrong
# alternative here: acceptance is bound to the exact artifact, so every Renovate
# image bump would need it granted again.
#
# trustedProxies is the Traefik host, taken from the inventory rather than
# written as a literal. 2.0 attributes proxy-shaped traffic before it
# authenticates it: a request carrying forwarded-client headers from a source
# not listed here is rejected with proxy_attribution_required, whatever the auth
# mode. One address, not the subnet — upstream's own hardening checklist asks
# for the actual proxy IPs and nothing wider.
- name: OPENCLAW - Apply deployment shape to the seeded configuration
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --init
      - --security-opt=no-new-privileges:true
      - --cap-drop=NET_RAW
      - --cap-drop=NET_ADMIN
      - --env=HOME=/home/node
      - --env=OPENCLAW_HOME=/home/node
      - --env=OPENCLAW_STATE_DIR=/home/node/.openclaw
      - --env=OPENCLAW_CONFIG_DIR=/home/node/.openclaw
      - --env=OPENCLAW_CONFIG_PATH=/home/node/.openclaw/openclaw.json
      # The seeded config holds SecretRefs naming these, and `config set`
      # validates the whole file before writing, so they have to resolve here.
      - --env=OPENCLAW_GATEWAY_TOKEN
      - --env=OPENROUTER_API_KEY
      - "--volume={{ base_dir }}/openclaw/state:/home/node/.openclaw"
      - "--volume={{ base_dir }}/openclaw/auth:/home/node/.config/openclaw"
      - "{{ openclaw_image.image.Id }}"
      - node
      - dist/index.js
      - config
      - set
      - --batch-json
      - "{{ openclaw_shape | to_json }}"
  vars:
    openclaw_shape:
      - path: gateway.bind
        value: lan
      - path: gateway.publicOrigin
        value: "https://openclaw.{{ domain }}"
      - path: gateway.controlUi.allowedOrigins
        value:
          - "https://openclaw.{{ domain }}"
      - path: plugins.deny
        value:
          - perplexity
      - path: gateway.trustedProxies
        value:
          - "{{ groups['development'] | first }}"
  environment:
    OPENCLAW_GATEWAY_TOKEN: "{{ OPENCLAW_GATEWAY_TOKEN }}"
    OPENROUTER_API_KEY: "{{ OPENROUTER_API_KEY }}"
  when: not openclaw_config.stat.exists
  changed_when: true

- name: OPENCLAW - Create container
  community.docker.docker_container:
    name: openclaw
    image: ghcr.io/openclaw/openclaw:2026.8.1
    restart_policy: always
    state: started
    pull: false
    init: true
    networks:
      - name: homelab
    # --bind agrees with gateway.bind in the seeded config on purpose. The flag
    # binds the running process; the config value is what the CLI and plugins
    # read, and device pairing refuses to issue a URL when it sees the loopback
    # default. This is the command upstream's own compose file uses at 2026.8.1.
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    ports:
      - "18789:18789"
    volumes:
      - "{{ base_dir }}/openclaw/state:/home/node/.openclaw"
      - "{{ base_dir }}/openclaw/auth:/home/node/.config/openclaw"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opts:
      - no-new-privileges:true
    env:
      TZ: "{{ timezone }}"
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      # Pinned to container paths so the host bind-mount sources can never leak
      # into the paths OpenClaw resolves at runtime (upstream compose does the same).
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      # 2.0 lets an external supervisor own the lifecycle. Docker's restart
      # policy is that supervisor, so refuse the self-update path and the native
      # service manager the gateway would otherwise reach for — this container is
      # replaced by Renovate bumping the tag above, not by OpenClaw.
      OPENCLAW_SUPERVISOR_MODE: external
      # Still passed to the running gateway: the seeded config holds SecretRefs
      # naming these variables, not the secrets themselves, so they have to
      # resolve in the gateway's own environment.
      OPENCLAW_GATEWAY_TOKEN: "{{ OPENCLAW_GATEWAY_TOKEN }}"
      OPENROUTER_API_KEY: "{{ OPENROUTER_API_KEY }}"

- name: OPENCLAW - Define service entry
  ansible.builtin.set_fact:
    openclaw_entry:
      name: openclaw
      description: AI agent gateway
      host: "openclaw.{{ domain }}"
      ip: "{{ inventory_hostname }}"
      friendly_name: "{{ friendly_name }}"
      port: 18789
      scheme: http
      # No authelia middleware: the gateway does its own auth. A non-loopback
      # bind requires it, and onboarding set mode=token with the token held as a
      # SecretRef, so the Control UI already asks for a credential. Putting
      # Authelia in front only added a second, unrelated login.
      secured: false
      healthcheck: true
      # 2.0 splits the probes: /healthz is liveness, /startupz is traffic
      # admission, /readyz is the deep channel-aware one. Gatus is monitoring
      # rather than an orchestrator probe, so it stays on the strict endpoint.
      healthcheck_path: /readyz
      homepage: true
      proxied: true

- name: OPENCLAW - Append to docker_services
  ansible.builtin.set_fact:
    docker_services: "{{ docker_services + [openclaw_entry] }}"
