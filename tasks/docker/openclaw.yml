---
# OpenClaw runs as uid 1000 (`node`) inside the image and will not start if the
# bind mounts are owned by anyone else, so the ownership here is the numeric uid
# rather than {{ username }} — it has to match the container's user, not the host's.
#
# Deliberately not recursive: OpenClaw owns everything under these paths at
# runtime (workspace files, plugin installs, browser caches), and re-applying a
# directory mode across that tree every run would both churn and flip the
# seeded openclaw.json below back to 0750.
- name: OPENCLAW - Create directories and permissions
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0750"
  loop:
    - "{{ base_dir }}/openclaw/state"
    - "{{ base_dir }}/openclaw/auth"

# Ansible owns these keys, the Control UI owns the rest of openclaw.json.
# gateway.mode is boot-critical — the gateway refuses to start without it and
# will not guess. allowedOrigins has to match how the container is actually
# published, so it is deployment shape, not a user preference. Both therefore
# belong in code. Keeping them here rather than in the seed template means one
# source of truth: the reconcile task below applies them to existing configs too.
- name: OPENCLAW - Define Ansible-managed configuration
  ansible.builtin.set_fact:
    openclaw_managed_config:
      gateway:
        mode: local
        controlUi:
          # Only the proxied origin needs listing. OpenClaw already accepts
          # same-origin loads from RFC1918 hosts, which covers reaching the
          # published port directly on the LAN or over the tailnet.
          allowedOrigins:
            - "https://openclaw.{{ domain }}"

- name: OPENCLAW - Stat configuration file
  ansible.builtin.stat:
    path: "{{ base_dir }}/openclaw/state/openclaw.json"
  register: openclaw_config

# Seeded once: the Control UI writes settings back to this same file, so
# re-templating every run would revert anything changed in the dashboard.
- name: OPENCLAW - Seed configuration file
  ansible.builtin.template:
    src: ../config/openclaw/openclaw.json.j2
    dest: "{{ base_dir }}/openclaw/state/openclaw.json"
    owner: "1000"
    group: "1000"
    mode: "0600"
  when: not openclaw_config.stat.exists

- name: OPENCLAW - Read configuration
  ansible.builtin.slurp:
    src: "{{ base_dir }}/openclaw/state/openclaw.json"
  register: openclaw_config_existing

# Merges the managed keys into whatever is on disk, so a config seeded before a
# key existed is repaired rather than left broken, and Control UI settings are
# preserved. The comparison keeps it idempotent — it only writes when the merge
# would actually change something, so it does not churn or restart every run.
- name: OPENCLAW - Reconcile Ansible-managed configuration
  ansible.builtin.copy:
    content: "{{ openclaw_merged | to_nice_json }}"
    dest: "{{ base_dir }}/openclaw/state/openclaw.json"
    owner: "1000"
    group: "1000"
    mode: "0600"
  vars:
    openclaw_existing: "{{ openclaw_config_existing.content | b64decode | from_json }}"
    openclaw_merged: "{{ openclaw_existing | combine(openclaw_managed_config, recursive=true) }}"
  when: openclaw_merged != openclaw_existing
  register: openclaw_config_reconciled

- name: OPENCLAW - Pre-pull image
  community.docker.docker_image:
    name: "{{ image }}"
    source: pull
    force_source: true
  vars:
    image: ghcr.io/openclaw/openclaw:2026.7.1-2

- name: OPENCLAW - Create container
  community.docker.docker_container:
    name: openclaw
    image: ghcr.io/openclaw/openclaw:2026.7.1-2
    restart_policy: always
    state: started
    pull: false
    init: true
    networks:
      - name: homelab
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    ports:
      - "18789:18789"
    volumes:
      - "{{ base_dir }}/openclaw/state:/home/node/.openclaw"
      - "{{ base_dir }}/openclaw/auth:/home/node/.config/openclaw"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opts:
      - no-new-privileges:true
    env:
      TZ: "{{ timezone }}"
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      # Pinned to container paths so the host bind-mount sources can never leak
      # into the paths OpenClaw resolves at runtime (upstream compose does the same).
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: "{{ OPENCLAW_GATEWAY_TOKEN }}"
      OPENROUTER_API_KEY: "{{ OPENROUTER_API_KEY }}"

# The gateway reads allowed origins at startup, and a running container will not
# pick up a reconciled config on its own. Previously this was masked: the config
# fix in #169 landed while the container was crash-looping, so the restart policy
# reloaded it for free. A healthy container needs to be told.
- name: OPENCLAW - Restart to apply config changes
  ansible.builtin.command: docker restart openclaw
  when: openclaw_config_reconciled.changed
  changed_when: true

- name: OPENCLAW - Define service entry
  ansible.builtin.set_fact:
    openclaw_entry:
      name: openclaw
      description: AI agent gateway
      host: "openclaw.{{ domain }}"
      ip: "{{ inventory_hostname }}"
      friendly_name: "{{ friendly_name }}"
      port: 18789
      scheme: http
      secured: true
      healthcheck: true
      healthcheck_path: /readyz
      homepage: true
      proxied: true

- name: OPENCLAW - Append to docker_services
  ansible.builtin.set_fact:
    docker_services: "{{ docker_services + [openclaw_entry] }}"
