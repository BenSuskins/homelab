---
# OpenClaw runs as uid 1000 (`node`) inside the image and will not start if the
# bind mounts are owned by anyone else, so the ownership here is the numeric uid
# rather than {{ username }} — it has to match the container's user, not the host's.
#
# Deliberately not recursive: OpenClaw owns everything under these paths at
# runtime (workspace files, plugin installs, browser caches), and re-applying a
# directory mode across that tree every run would both churn and flip
# openclaw.json back to 0750.
- name: OPENCLAW - Create directories and permissions
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0750"
  loop:
    - "{{ base_dir }}/openclaw/state"
    - "{{ base_dir }}/openclaw/auth"

# 2.0 validates this file strictly: unknown keys, wrong types or bad values make
# the gateway refuse to start. Every key below is in the 2.0 schema.
#
# gateway.mode is boot-critical — the gateway refuses to start without it and
# will not guess. allowedOrigins has to match how the container is published, or
# the Control UI is rejected. publicOrigin is what 2.0 stamps into deep links
# back into the Control UI, so it has to be the Traefik hostname rather than the
# container's own address. All three live in the template, which is applied every
# run like every other templated container here.
- name: OPENCLAW - Create configuration
  ansible.builtin.template:
    src: ../config/openclaw/openclaw.json.j2
    dest: "{{ base_dir }}/openclaw/state/openclaw.json"
    owner: "1000"
    group: "1000"
    mode: "0600"
  register: openclaw_config

- name: OPENCLAW - Pre-pull image
  community.docker.docker_image:
    name: "{{ image }}"
    source: pull
    force_source: true
  register: openclaw_image
  vars:
    image: ghcr.io/openclaw/openclaw:2026.8.1

- name: OPENCLAW - Inspect the running container
  community.docker.docker_container_info:
    name: openclaw
  register: openclaw_container

# An image change is the upgrade: `container.Image` is the id the running
# container was created from, so comparing it against the id we just pulled says
# whether the mounted state is about to be served by a different release. That
# keeps the migration below off every ordinary run without a hand-maintained
# "have we done v2 yet" marker that goes stale at the next major.
#
# `exists` is checked first (Jinja `and` short-circuits) because a host with no
# container yet has no state to migrate.
- name: OPENCLAW - Decide whether the state needs an upgrade migration
  ansible.builtin.set_fact:
    openclaw_upgrading: "{{ openclaw_container.exists and openclaw_container.container.Image != openclaw_image.image.Id }}"

# Doctor writes the same SQLite databases the gateway has open, so the gateway
# has to be down first — upstream is explicit that state migrations run against a
# stopped gateway.
- name: OPENCLAW - Stop the gateway before migrating its state
  ansible.builtin.command: docker stop openclaw
  when: openclaw_upgrading | bool
  changed_when: true

# Startup repairs cover most upgrades on their own, but 2.0 carries migrations
# that reach past openclaw.json into stored sessions and automation routes
# (`codex/*` and `openai-codex/*` model refs become `openai/*`, the bundled
# OpenProse plugin is gone). When startup can't finish those safely it exits
# rather than reporting healthy, which under `restart_policy: always` is a crash
# loop instead of an error — so the documented one-shot doctor pass runs first,
# with the same mounts and the new image.
#
# Run by image id, not tag, so it is exactly the image the container below gets.
# Both supervisor variables are set: Docker owns the lifecycle here, and neither
# doctor nor the gateway should be repairing or installing native services.
- name: OPENCLAW - Migrate state with the pulled image (openclaw doctor --fix)
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --init
      - --security-opt=no-new-privileges:true
      - --cap-drop=NET_RAW
      - --cap-drop=NET_ADMIN
      - --env=HOME=/home/node
      - --env=OPENCLAW_HOME=/home/node
      - --env=OPENCLAW_STATE_DIR=/home/node/.openclaw
      - --env=OPENCLAW_CONFIG_DIR=/home/node/.openclaw
      - --env=OPENCLAW_CONFIG_PATH=/home/node/.openclaw/openclaw.json
      - --env=OPENCLAW_WORKSPACE_DIR=/home/node/.openclaw/workspace
      - --env=OPENCLAW_SUPERVISOR_MODE=external
      - --env=OPENCLAW_SERVICE_REPAIR_POLICY=external
      - "--volume={{ base_dir }}/openclaw/state:/home/node/.openclaw"
      - "--volume={{ base_dir }}/openclaw/auth:/home/node/.config/openclaw"
      - "{{ openclaw_image.image.Id }}"
      - node
      - dist/index.js
      - doctor
      - --fix
  when: openclaw_upgrading | bool
  changed_when: true

- name: OPENCLAW - Create container
  community.docker.docker_container:
    name: openclaw
    image: ghcr.io/openclaw/openclaw:2026.8.1
    restart_policy: always
    state: started
    pull: false
    init: true
    networks:
      - name: homelab
    # --bind agrees with gateway.bind in the template on purpose. The flag binds
    # the running process; the config value is what the CLI and plugins read, and
    # device pairing refuses to issue a URL when it sees the loopback default.
    # This is the command upstream's own compose file still uses at 2026.8.1.
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    ports:
      - "18789:18789"
    volumes:
      - "{{ base_dir }}/openclaw/state:/home/node/.openclaw"
      - "{{ base_dir }}/openclaw/auth:/home/node/.config/openclaw"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opts:
      - no-new-privileges:true
    env:
      TZ: "{{ timezone }}"
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      # Pinned to container paths so the host bind-mount sources can never leak
      # into the paths OpenClaw resolves at runtime (upstream compose does the same).
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      # 2.0 lets an external supervisor own the lifecycle. Docker's restart
      # policy is that supervisor, so refuse the self-update path and the native
      # service manager the gateway would otherwise reach for — this container
      # is replaced by Renovate bumping the tag above, not by OpenClaw.
      OPENCLAW_SUPERVISOR_MODE: external
      OPENCLAW_GATEWAY_TOKEN: "{{ OPENCLAW_GATEWAY_TOKEN }}"
      OPENROUTER_API_KEY: "{{ OPENROUTER_API_KEY }}"

# The gateway reads its config at startup and a running container will not pick
# up a rewritten file on its own. #169 masked this: that config fix landed while
# the container was crash-looping, so the restart policy reloaded it for free.
# A healthy container has to be told. An upgrade already replaced the container
# above, which read the new file on the way up.
- name: OPENCLAW - Restart to apply config changes
  ansible.builtin.command: docker restart openclaw
  when:
    - openclaw_config.changed
    - not (openclaw_upgrading | bool)
  changed_when: true

- name: OPENCLAW - Define service entry
  ansible.builtin.set_fact:
    openclaw_entry:
      name: openclaw
      description: AI agent gateway
      host: "openclaw.{{ domain }}"
      ip: "{{ inventory_hostname }}"
      friendly_name: "{{ friendly_name }}"
      port: 18789
      scheme: http
      secured: true
      healthcheck: true
      # 2.0 splits the probes: /healthz is liveness, /startupz is traffic
      # admission, /readyz is the deep channel-aware one. Gatus is monitoring
      # rather than an orchestrator probe, so it stays on the strict endpoint.
      healthcheck_path: /readyz
      homepage: true
      proxied: true

- name: OPENCLAW - Append to docker_services
  ansible.builtin.set_fact:
    docker_services: "{{ docker_services + [openclaw_entry] }}"
