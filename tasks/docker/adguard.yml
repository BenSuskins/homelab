---
- name: ADGUARD - Create directory and permissions
  ansible.builtin.file:
    path: "{{ item }}"
    recurse: true
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0750"
  loop:
    - "{{ base_dir }}/adguard/config"
    - "{{ base_dir }}/adguard/data"

# AdGuard binds host port 53 for DNS, which collides with systemd-resolved's
# stub listener on 127.0.0.53:53. Disable the stub (resolved still resolves host
# DNS via the real upstreams) so port 53 is free before the container starts.
- name: ADGUARD - Ensure resolved drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: ADGUARD - Disable systemd-resolved stub listener
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/disable-stub.conf
    content: |
      [Resolve]
      DNSStubListener=no
    owner: root
    group: root
    mode: "0644"
  register: adguard_resolved_stub

- name: ADGUARD - Point resolv.conf at upstream resolvers
  ansible.builtin.file:
    src: /run/systemd/resolve/resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true

- name: ADGUARD - Restart systemd-resolved to release port 53
  ansible.builtin.service:
    name: systemd-resolved
    state: restarted
  when: adguard_resolved_stub.changed

- name: ADGUARD - Pre-pull image
  community.docker.docker_image:
    name: "{{ image }}"
    source: pull
    force_source: true
  vars:
    image: adguard/adguardhome:v0.107.80

- name: ADGUARD - Create container
  community.docker.docker_container:
    name: adguard
    image: adguard/adguardhome:v0.107.80
    restart_policy: always
    state: started
    pull: false
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3124:3000"
      - "80:80"
      - "443:443"
    networks:
      - name: homelab
    volumes:
      - "{{ base_dir }}/adguard/config:/opt/adguardhome/conf"
      - "{{ base_dir }}/adguard/data:/opt/adguardhome/work"

- name: ADGUARD - Define service entry
  ansible.builtin.set_fact:
    adguard_entry:
      name: adguard-home
      description: DNS ad blocker
      host: "adguard-home.{{ domain }}"
      ip: "{{ inventory_hostname }}"
      friendly_name: "{{ friendly_name }}"
      port: 80
      scheme: http
      secured: false
      healthcheck: true
      homepage: true
      proxied: true

- name: ADGUARD - Append to docker_services
  ansible.builtin.set_fact:
    docker_services: "{{ docker_services + [adguard_entry] }}"

# AdGuard reads its config only at startup and writes it as root (0600).
# Compare parsed YAML (not bytes) so formatting/key-order differences between our
# template and AdGuard's own serialization never trigger a needless restart.
# Only on a real content change do we stop -> write -> start, avoiding a restart
# race where AdGuard could flush stale in-memory config over our file.
- name: ADGUARD - Render desired config
  ansible.builtin.set_fact:
    adguard_desired_config: "{{ lookup('ansible.builtin.template', playbook_dir + '/../config/adguard/AdGuardHome.yaml.j2') | from_yaml }}"

- name: ADGUARD - Read current config
  ansible.builtin.slurp:
    src: "{{ base_dir }}/adguard/config/AdGuardHome.yaml"
  register: adguard_current_raw

- name: ADGUARD - Apply managed config
  when: (adguard_current_raw.content | b64decode | from_yaml) != adguard_desired_config
  block:
    - name: ADGUARD - Stop container before writing config
      community.docker.docker_container:
        name: adguard
        state: stopped

    - name: ADGUARD - Write managed config
      ansible.builtin.template:
        src: ../config/adguard/AdGuardHome.yaml.j2
        dest: "{{ base_dir }}/adguard/config/AdGuardHome.yaml"
        owner: root
        group: root
        mode: "0600"

    - name: ADGUARD - Start container with updated config
      community.docker.docker_container:
        name: adguard
        state: started
